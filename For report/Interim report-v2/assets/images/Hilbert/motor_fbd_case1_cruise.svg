<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="auto" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="c1-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="c1-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="c1-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="c1-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="660" height="320" rx="12" fill="#090f1d" stroke="#334155" stroke-width="1.5" filter="url(#c1-shadow)"/>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Case 1: Straight Flat Cruising at 15 km/h (4.167 m/s)</text>
  <text x="340" y="54" text-anchor="middle" fill="#94a3b8" font-size="11.5">Equilibrium between 4WD Tractive Effort and Rolling + Aerodynamic Resistances</text>

  <!-- Ground Plane -->
  <line x1="60" y1="245" x2="620" y2="245" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="265" fill="#64748b" font-size="10" text-anchor="end">Dry Grooved Runway Asphalt (C_rr = 0.025)</text>

  <!-- Chassis Body -->
  <rect x="180" y="110" width="320" height="95" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="142" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">FOD HUNTER CHASSIS (m = 65.0 kg)</text>
  <text x="340" y="160" text-anchor="middle" fill="#94a3b8" font-size="10.5">4x Independent ZLLG80 Direct-Drive Hubs (4WD)</text>

  <!-- Wheels (D = 263 mm, r = 131.5 mm) -->
  <!-- Rear Wheels -->
  <circle cx="240" cy="205" r="40" fill="#020617" stroke="#10b981" stroke-width="3"/>
  <circle cx="240" cy="205" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="240" y="209" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700">REAR</text>

  <!-- Front Wheels -->
  <circle cx="440" cy="205" r="40" fill="#020617" stroke="#10b981" stroke-width="3"/>
  <circle cx="440" cy="205" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="440" y="209" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700">FRONT</text>

  <!-- Velocity Vector -->
  <line x1="340" y1="85" x2="440" y2="85" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#c1-blue)"/>
  <text x="450" y="89" fill="#38bdf8" font-size="11" font-weight="700">v = 15 km/h (302.6 RPM)</text>

  <!-- Forces: Gravity & Normal -->
  <line x1="340" y1="150" x2="340" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#c1-rose)"/>
  <text x="348" y="222" fill="#f59e0b" font-size="10.5" font-weight="700">W = 637.65 N</text>

  <!-- Tractive Drive Force (Forward) -->
  <line x1="440" y1="245" x2="530" y2="245" stroke="#10b981" stroke-width="3" marker-end="url(#c1-green)"/>
  <text x="535" y="241" fill="#10b981" font-size="11" font-weight="700">F_tractive = 18.87 N</text>
  <text x="535" y="255" fill="#6ee7b7" font-size="9.5">(tau_motor = 0.73 Nm per hub)</text>

  <!-- Resistive Forces (Backward) -->
  <!-- Aerodynamic Drag -->
  <line x1="180" y1="135" x2="110" y2="135" stroke="#f43f5e" stroke-width="2" marker-end="url(#c1-rose)"/>
  <text x="105" y="130" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="end">F_aero = 2.93 N</text>

  <!-- Rolling Resistance -->
  <line x1="240" y1="245" x2="160" y2="245" stroke="#f43f5e" stroke-width="2" marker-end="url(#c1-rose)"/>
  <text x="155" y="241" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="end">F_rr = 15.94 N</text>

  <!-- Summary Badge Box -->
  <rect x="50" y="280" width="580" height="35" rx="6" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1"/>
  <text x="340" y="302" text-anchor="middle" fill="#f8fafc" font-size="11">
    <tspan font-weight="700" fill="#10b981">Total Force:</tspan> 18.87 N | 
    <tspan font-weight="700" fill="#10b981">Torque / Motor:</tspan> 0.73 Nm | 
    <tspan font-weight="700" fill="#38bdf8">P_mech:</tspan> 78.6 W | 
    <tspan font-weight="700" fill="#f59e0b">Headroom:</tspan> 20.5x margin below 15.0 Nm continuous
  </text>
</svg>