    <g transform="translate(16, 48)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
      <text y="14" fill="#f5f5f7" font-weight="600">Hardware:</text>
      <text y="14" x="248" text-anchor="end" fill="#86868b">Core i7 / RTX 4070 (SIL Host)</text>

      <text y="38" fill="#f5f5f7" font-weight="600">OS &amp; Stack:</text>
      <text y="38" x="248" text-anchor="end" fill="#86868b">Ubuntu 24.04 &#8226; Gazebo + Nav2</text>

      <text y="62" fill="#f5f5f7" font-weight="600">Wi-Fi IP:</text>
      <text y="62" x="248" text-anchor="end" fill="#30d158" font-family="monospace" font-weight="700">192.168.168.50</text>

      <text y="86" fill="#f5f5f7" font-weight="600">Direct RJ45 IP:</text>
      <text y="86" x="248" text-anchor="end" fill="#30d158" font-family="monospace" font-weight="700">192.168.137.1</text>

      <line x1="0" y1="102" x2="248" y2="102" stroke="rgba(255,255,255,0.08)"/>

      <text y="122" fill="#30d158" font-weight="700">ugv_c2_bridge_node.py</text>
      <text y="142" fill="#86868b" font-size="11">&#8226; Ingests /c2/target_alert into queue</text>
      <text y="158" fill="#86868b" font-size="11">&#8226; Dispatches Nav2 NavigateToPose</text>
      <text y="174" fill="#86868b" font-size="11">&#8226; Broadcasts /c2/ugv_telemetry (2 Hz)</text>
      <text y="190" fill="#86868b" font-size="11">&#8226; Markers: /c2/queued_waypoints_markers</text>
      <text y="206" fill="#86868b" font-size="11">&#8226; Gazebo Harmonic digital twin sync</text>
    </g>
  </g>

  <!-- Bottom Verified Testbed IP Summary Banner -->
  <g transform="translate(40, 390)">
    <rect width="920" height="95" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="24" fill="#2997ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">VERIFIED TESTBED IP CONFIGURATION (simulation/setup_dds.sh &amp; cyclonedds.xml)</text>

    <!-- Inset Table -->
    <g transform="translate(20, 36)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      <text y="16" fill="#86868b">Primary Wi-Fi Subnet (192.168.168.0/24):</text>
      <text y="16" x="280" fill="#f5f5f7">Argus UAV: <tspan fill="#2997ff" font-family="monospace" font-weight="700">192.168.168.100</tspan></text>
      <text y="16" x="500" fill="#f5f5f7">FOD Hunter UGV: <tspan fill="#30d158" font-family="monospace" font-weight="700">192.168.168.50</tspan></text>
      <text y="16" x="740" fill="#2997ff">(GL.iNet 5 GHz Access Point)</text>

      <text y="40" fill="#86868b">Fallback Direct RJ45 (192.168.137.0/24):</text>
      <text y="40" x="280" fill="#f5f5f7">Argus UAV: <tspan fill="#2997ff" font-family="monospace" font-weight="700">192.168.137.233</tspan></text>
      <text y="40" x="500" fill="#f5f5f7">FOD Hunter UGV: <tspan fill="#30d158" font-family="monospace" font-weight="700">192.168.137.1</tspan></text>
      <text y="40" x="740" fill="#30d158">(Zero-switch Cat6 Direct Link)</text>
