<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162038"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="580" fill="url(#bgGrad2)" rx="16"/>
  <rect x="2" y="2" width="1076" height="576" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">
    ROS 2 Jazzy — Gazebo Harmonic Simulation Architecture
  </text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Bidirectional parameter bridge, clock synchronization, state estimation, and Nav2 action topology
  </text>

  <!-- COLUMN 1: GAZEBO HARMONIC (LEFT) -->
  <g transform="translate(40, 95)" filter="url(#shadow2)">
    <rect width="300" height="425" rx="12" fill="url(#cardGrad2)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="36" rx="12" fill="#be123c"/>
    <text x="150" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">GAZEBO HARMONIC (SIMULATOR)</text>

    <!-- World & Physics -->
    <rect x="16" y="50" width="268" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fb7185">World &amp; DART Physics Engine</text>
    <text x="26" y="88" font-family="monospace" font-size="10" fill="#cbd5e1">• airport_runway.sdf / nus_ea_field.sdf</text>
    <text x="26" y="104" font-family="monospace" font-size="10" fill="#cbd5e1">• max_step_size: 0.001 s (1000 Hz)</text>
    <text x="26" y="120" font-family="monospace" font-size="10" fill="#cbd5e1">• real_time_factor target: 1.0</text>
    <text x="26" y="136" font-family="monospace" font-size="10" fill="#cbd5e1">• Coulomb friction mu = 0.80 on tarmac</text>

    <!-- Robot Model & Actuators -->
    <rect x="16" y="155" width="268" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fb7185">Robot &amp; Actuator Plugins</text>
    <text x="26" y="193" font-family="monospace" font-size="10" fill="#cbd5e1">• Scout 2.0 4WD Skid-Steer URDF</text>
    <text x="26" y="209" font-family="monospace" font-size="10" fill="#cbd5e1">• gz-sim-diff-drive-system plugin</text>
    <text x="26" y="225" font-family="monospace" font-size="10" fill="#cbd5e1">• gz-sim-joint-state-publisher-system</text>
    <text x="26" y="241" font-family="monospace" font-size="10" fill="#38bdf8">• Ingests Gazebo /cmd_vel commands</text>

    <!-- Synthetic Sensors -->
    <rect x="16" y="260" width="268" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fb7185">Synthetic Sensor Systems</text>
    <text x="26" y="300" font-family="monospace" font-size="10" fill="#e2e8f0">• GPU Ray LiDAR (360° × 1 ray, 10 Hz)</text>
    <text x="26" y="318" font-family="monospace" font-size="10" fill="#e2e8f0">• RGB-D Camera (640×480 @ 30 Hz)</text>
    <text x="26" y="336" font-family="monospace" font-size="10" fill="#e2e8f0">• 9-DOF IMU Sensor (100 Hz, noise)</text>
    <text x="26" y="354" font-family="monospace" font-size="10" fill="#e2e8f0">• NavSat GPS Receiver (5 Hz, noise)</text>
    <text x="26" y="372" font-family="monospace" font-size="10" fill="#e2e8f0">• Ground truth /model/scout/odometry</text>
    <text x="26" y="394" font-family="monospace" font-size="9.5" fill="#94a3b8">Publishes raw Gazebo protobuf msgs</text>
  </g>

  <!-- COLUMN 2: ROS_GZ_BRIDGE (CENTER) -->
  <g transform="translate(375, 95)" filter="url(#shadow2)">
    <rect width="250" height="425" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="36" rx="12" fill="#0284c7"/>
    <text x="125" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ROS_GZ_BRIDGE INTERFACE</text>

    <rect x="14" y="50" width="222" height="70" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Clock Synchronization</text>
    <text x="24" y="88" font-family="monospace" font-size="10" fill="#e0f2fe">GZ /clock [gz.msgs.Clock]</text>
    <text x="24" y="104" font-family="monospace" font-size="10" fill="#38bdf8">→ ROS /clock (use_sim_time)</text>

    <rect x="14" y="130" width="222" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Sensor Bridges (GZ → ROS)</text>
    <text x="24" y="170" font-family="monospace" font-size="9.5" fill="#cbd5e1">• /scan: LaserScan</text>
    <text x="24" y="188" font-family="monospace" font-size="9.5" fill="#cbd5e1">• /camera/image_raw: Image</text>
    <text x="24" y="206" font-family="monospace" font-size="9.5" fill="#cbd5e1">• /imu/data: Imu</text>
    <text x="24" y="224" font-family="monospace" font-size="9.5" fill="#cbd5e1">• /gps/fix: NavSatFix</text>
    <text x="24" y="242" font-family="monospace" font-size="9.5" fill="#cbd5e1">• /odom: Odometry (50 Hz)</text>
    <text x="24" y="260" font-family="monospace" font-size="9.5" fill="#cbd5e1">• /tf: gz.msgs.Pose_V</text>

    <rect x="14" y="295" width="222" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="315" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Control Bridge (ROS → GZ)</text>
    <text x="24" y="335" font-family="monospace" font-size="10" fill="#34d399">ROS /cmd_vel [Twist]</text>
    <text x="24" y="353" font-family="monospace" font-size="9.5" fill="#cbd5e1">→ GZ /cmd_vel [gz.msgs.Twist]</text>
    <text x="24" y="375" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">Bridges 20 Hz velocity</text>
    <text x="24" y="391" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94a3b8">commands into simulation</text>
  </g>

  <!-- COLUMN 3: ROS 2 JAZZY & NAV2 (RIGHT) -->
  <g transform="translate(660, 95)" filter="url(#shadow2)">
    <rect width="380" height="425" rx="12" fill="url(#cardGrad2)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="36" rx="12" fill="#059669"/>
    <text x="190" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">ROS 2 JAZZY &amp; NAV2 ECOSYSTEM</text>

    <!-- State Estimation -->
    <rect x="16" y="50" width="348" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">Dual-EKF (robot_localization)</text>
    <text x="26" y="88" font-family="monospace" font-size="10" fill="#cbd5e1">• ekf_filter_node_odom: Fuses /odom + /imu/data</text>
    <text x="26" y="104" font-family="monospace" font-size="10" fill="#cbd5e1">• navsat_transform_node: WGS84 GPS → UTM metric</text>
    <text x="26" y="120" font-family="monospace" font-size="10" fill="#cbd5e1">• ekf_filter_node_map: Fuses odom + GPS → map frame</text>
    <text x="26" y="136" font-family="monospace" font-size="10" fill="#38bdf8">• Publishes REP-105 TF tree (map → odom → base)</text>

    <!-- Nav2 Planning & Control -->
    <rect x="16" y="155" width="348" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">Nav2 Autonomy Stack (nav2_bringup)</text>
    <text x="26" y="193" font-family="monospace" font-size="10" fill="#cbd5e1">• Global Costmap: 5cm static orthophoto + /scan</text>
    <text x="26" y="211" font-family="monospace" font-size="10" fill="#cbd5e1">• Local Costmap: 6x6m rolling window @ 20 Hz</text>
    <text x="26" y="229" font-family="monospace" font-size="10" fill="#cbd5e1">• SmacPlannerHybrid: Reeds-Shepp lattice (R=1.0m)</text>
    <text x="26" y="247" font-family="monospace" font-size="10" fill="#cbd5e1">• Regulated Pure Pursuit: L=1.2m, v_max=2.22 m/s</text>
    <text x="26" y="265" font-family="monospace" font-size="10" fill="#cbd5e1">• Curvature scaling (R=0.8m) &amp; proximity braking</text>
    <text x="26" y="285" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">• Outputs: /cmd_vel velocity commands (20 Hz)</text>

    <!-- Mission & Visualization -->
    <rect x="16" y="315" width="348" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="335" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">C2 Mission Dispatch &amp; RViz2</text>
    <text x="26" y="353" font-family="monospace" font-size="10" fill="#cbd5e1">• CycloneDDS unicast network (192.168.1.x)</text>
    <text x="26" y="369" font-family="monospace" font-size="10" fill="#cbd5e1">• Action: /navigate_to_pose waypoint dispatch</text>
    <text x="26" y="385" font-family="monospace" font-size="10" fill="#cbd5e1">• RViz2 visualization: TF, Costmap, Path, Laser</text>
    <text x="26" y="401" font-family="monospace" font-size="10" fill="#cbd5e1">• Multi-machine telemetry to Ground Station</text>
  </g>

  <!-- Connectors -->
  <path d="M 340 330 L 375 330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 375 380 L 340 380" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 625 210 L 660 210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 660 380 L 625 380" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Bottom Legend -->
  <text x="40" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
    Launch Configuration: simulation/src/runway_navigation/launch/sim_and_nav.launch.py • Clean separation between simulator physics, bridge translation, and autonomous decision nodes.
  </text>
</svg>
