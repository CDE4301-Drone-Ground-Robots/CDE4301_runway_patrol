<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162038"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowAmber2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowEmerald2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="580" fill="url(#bgGrad4)" rx="16"/>
  <rect x="2" y="2" width="1076" height="576" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">
    Heterogeneous UAV–UGV Airside Runway Remediation Dispatch Workflow
  </text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Autonomous coordination from UAV aerial FOD identification to UGV ground navigation &amp; debris collection
  </text>

  <!-- COLUMN 1: UAV SCOUT (AIRBORNE) -->
  <g transform="translate(40, 100)" filter="url(#shadow4)">
    <rect width="310" height="420" rx="12" fill="url(#cardGrad4)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="url(#cyanBlue)"/>
    <text x="155" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1. UAV AIRBORNE SURVEY</text>

    <!-- Subitem 1 -->
    <rect x="16" y="52" width="278" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Aerial Runway Sweep</text>
    <text x="28" y="90" font-family="monospace" font-size="10.5" fill="#e2e8f0">• Holybro S500 / PX4 Autopilot</text>
    <text x="28" y="106" font-family="monospace" font-size="10" fill="#cbd5e1">• Flight Altitude: 15 m AGL</text>
    <text x="28" y="122" font-family="monospace" font-size="10" fill="#cbd5e1">• High-speed camera sweep (12 m/s)</text>
    <text x="28" y="138" font-family="monospace" font-size="10" fill="#94a3b8">• Covers entire runway in ~10 mins</text>

    <!-- Subitem 2 -->
    <rect x="16" y="157" width="278" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="177" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">YOLOv8 Edge FOD Detection</text>
    <text x="28" y="195" font-family="monospace" font-size="10.5" fill="#e2e8f0">• Onboard Jetson Orin Nano</text>
    <text x="28" y="211" font-family="monospace" font-size="10" fill="#cbd5e1">• FOD Classification: Bolts, metal,</text>
    <text x="28" y="227" font-family="monospace" font-size="10" fill="#cbd5e1">  luggage tags, gravel fragments</text>
    <text x="28" y="243" font-family="monospace" font-size="10" fill="#cbd5e1">• Pixel bbox → Optical projection</text>
    <text x="28" y="259" font-family="monospace" font-size="10" fill="#a7f3d0">• RTK georeferencing: (lat, lon, alt)</text>

    <!-- Subitem 3 -->
    <rect x="16" y="282" width="278" height="120" rx="8" fill="#083344" stroke="#0e7490" stroke-width="1"/>
    <text x="28" y="302" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#a5f3fc">UAV Telemetry Output:</text>
    <text x="28" y="322" font-family="monospace" font-size="10" fill="#cffafe">• JSON FOD Anomaly Payload:</text>
    <text x="36" y="338" font-family="monospace" font-size="9.5" fill="#67e8f9">{"id": 42, "type": "bolt",</text>
    <text x="36" y="354" font-family="monospace" font-size="9.5" fill="#67e8f9"> "lat": 1.34012, "lon": 103.96345,</text>
    <text x="36" y="370" font-family="monospace" font-size="9.5" fill="#67e8f9"> "confidence": 0.94}</text>
    <text x="28" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#a5f3fc">Transmitted via Zenoh / 5.8 GHz RF</text>
  </g>

  <!-- COLUMN 2: C2 BROKER & DISPATCH (CENTER) -->
  <g transform="translate(385, 100)" filter="url(#shadow4)">
    <rect width="310" height="420" rx="12" fill="url(#cardGrad4)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="url(#amberGold)"/>
    <text x="155" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2. C2 DISPATCH &amp; ROUTING</text>

    <!-- Subitem 1 -->
    <rect x="16" y="52" width="278" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Zenoh / DDS Communications</text>
    <text x="28" y="90" font-family="monospace" font-size="10.5" fill="#e2e8f0">• 5.8 GHz Airside Wi-Fi Bridge</text>
    <text x="28" y="106" font-family="monospace" font-size="10" fill="#cbd5e1">• CycloneDDS unicast topology</text>
    <text x="28" y="122" font-family="monospace" font-size="10" fill="#cbd5e1">• Low latency: &lt;15 ms transfer</text>
    <text x="28" y="138" font-family="monospace" font-size="10" fill="#94a3b8">• Heartbeat &amp; link-loss fail-safe</text>

    <!-- Subitem 2 -->
    <rect x="16" y="157" width="278" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="177" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Coordinate Projection &amp; Queue</text>
    <text x="28" y="195" font-family="monospace" font-size="10.5" fill="#e2e8f0">• WGS84 (GPS) → UTM Zone 48N</text>
    <text x="28" y="211" font-family="monospace" font-size="10" fill="#cbd5e1">• Transformation to Nav2 map frame</text>
    <text x="28" y="227" font-family="monospace" font-size="10" fill="#cbd5e1">• Queue Optimization Modes:</text>
    <text x="36" y="243" font-family="monospace" font-size="9.5" fill="#fde68a">1. Monotonic 1D Sweep along axis</text>
    <text x="36" y="259" font-family="monospace" font-size="9.5" fill="#fde68a">2. Dynamic 2-Opt TSP for clusters</text>

    <!-- Subitem 3 -->
    <rect x="16" y="282" width="278" height="120" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1"/>
    <text x="28" y="302" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fed7aa">UGV Mission Action Dispatch:</text>
    <text x="28" y="322" font-family="monospace" font-size="10" fill="#fef08a">→ Action: /navigate_to_pose</text>
    <text x="28" y="338" font-family="monospace" font-size="9.5" fill="#cbd5e1">• Target Pose: x_map, y_map, yaw</text>
    <text x="28" y="354" font-family="monospace" font-size="9.5" fill="#cbd5e1">• Approach Heading: Aligned with</text>
    <text x="28" y="370" font-family="monospace" font-size="9.5" fill="#cbd5e1">  vacuum nozzle centerline (±5°)</text>
    <text x="28" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#fed7aa">Supervised GCS override capable</text>
  </g>

  <!-- COLUMN 3: UGV REMEDIATION (GROUND) -->
  <g transform="translate(730, 100)" filter="url(#shadow4)">
    <rect width="310" height="420" rx="12" fill="url(#cardGrad4)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="url(#emeraldGreen)"/>
    <text x="155" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3. UGV GROUND REMEDIATION</text>

    <!-- Subitem 1 -->
    <rect x="16" y="52" width="278" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">Autonomous Tarmac Transit</text>
    <text x="28" y="90" font-family="monospace" font-size="10.5" fill="#e2e8f0">• SmacPlannerHybrid Path Search</text>
    <text x="28" y="106" font-family="monospace" font-size="10" fill="#cbd5e1">• RPP Velocity Control (v=2.22 m/s)</text>
    <text x="28" y="122" font-family="monospace" font-size="10" fill="#cbd5e1">• Obstacle avoidance (Hesai LiDAR)</text>
    <text x="28" y="138" font-family="monospace" font-size="10" fill="#94a3b8">• Dual-EKF closed-loop guidance</text>

    <!-- Subitem 2 -->
    <rect x="16" y="157" width="278" height="115" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="177" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">Precision Sweep &amp; Vacuum Intake</text>
    <text x="28" y="195" font-family="monospace" font-size="10.5" fill="#e2e8f0">• Final Approach: Decelerates to 0.5m/s</text>
    <text x="28" y="211" font-family="monospace" font-size="10" fill="#cbd5e1">• Vacuum Nozzle Activation (CANopen)</text>
    <text x="28" y="227" font-family="monospace" font-size="10" fill="#cbd5e1">• Suction sweeps over FOD target</text>
    <text x="28" y="243" font-family="monospace" font-size="10" fill="#cbd5e1">• Internal debris bin storage</text>
    <text x="28" y="259" font-family="monospace" font-size="10" fill="#a7f3d0">• Clearance confirmation sensor</text>

    <!-- Subitem 3 -->
    <rect x="16" y="282" width="278" height="120" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="28" y="302" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">Mission Completion Telemetry:</text>
    <text x="28" y="322" font-family="monospace" font-size="10" fill="#d1fae5">• Anomaly status marked "CLEARED"</text>
    <text x="28" y="338" font-family="monospace" font-size="9.5" fill="#cbd5e1">• Status transmitted to Airside Tower</text>
    <text x="28" y="354" font-family="monospace" font-size="9.5" fill="#cbd5e1">• UGV advances to next queued point</text>
    <text x="28" y="370" font-family="monospace" font-size="9.5" fill="#cbd5e1">• Resumes monotonic runway sweep</text>
    <text x="28" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#a7f3d0">Autonomous runway clearance achieved</text>
  </g>

  <!-- Connectors between stages -->
  <path d="M 350 310 L 385 310" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowCyan2)"/>
  <path d="M 695 310 L 730 310" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber2)"/>

  <!-- Bottom Legend -->
  <text x="40" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
    Implementation Status: Multi-agent coordination modeled and validated in simulation (Gazebo Harmonic + ROS 2 Jazzy) • Physical hardware field trials scheduled for Semester 2.
  </text>
</svg>
