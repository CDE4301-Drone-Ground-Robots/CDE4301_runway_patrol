<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162038"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="620" fill="url(#bgGrad2)" rx="16"/>
  <rect x="2" y="2" width="1076" height="616" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">
    Dual-EKF State Estimation Architecture &amp; REP-105 Coordinate Frame Topology
  </text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Continuous local dead-reckoning fusion (odom frame) coupled with discrete RTK-GNSS global referencing (map frame)
  </text>

  <!-- SENSORS COLUMN (LEFT) -->
  <g transform="translate(40, 100)" filter="url(#shadow2)">
    <rect width="210" height="340" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="36" rx="12" fill="#0284c7"/>
    <text x="105" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PHYSICAL SENSORS</text>

    <!-- Wheel Encoders -->
    <rect x="14" y="48" width="182" height="82" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Wheel Encoders (50 Hz)</text>
    <text x="24" y="86" font-family="monospace" font-size="10.5" fill="#e2e8f0">• 4× Hall pulse counting</text>
    <text x="24" y="102" font-family="monospace" font-size="10" fill="#94a3b8">  Topic: /odom</text>
    <text x="24" y="118" font-family="monospace" font-size="10" fill="#94a3b8">  Measures: v_x, v_y, ω_z</text>

    <!-- IMU -->
    <rect x="14" y="140" width="182" height="82" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#c084fc">9-DOF IMU (100 Hz)</text>
    <text x="24" y="178" font-family="monospace" font-size="10.5" fill="#e2e8f0">• Gyroscope + Accel</text>
    <text x="24" y="194" font-family="monospace" font-size="10" fill="#94a3b8">  Topic: /imu/data</text>
    <text x="24" y="210" font-family="monospace" font-size="10" fill="#94a3b8">  Measures: ω_z, a_x, yaw</text>

    <!-- RTK-GNSS -->
    <rect x="14" y="232" width="182" height="92" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">RTK-GNSS (5 Hz)</text>
    <text x="24" y="270" font-family="monospace" font-size="10.5" fill="#e2e8f0">• Dual-freq RTK Fix</text>
    <text x="24" y="286" font-family="monospace" font-size="10" fill="#94a3b8">  Topic: /gps/fix</text>
    <text x="24" y="302" font-family="monospace" font-size="10" fill="#94a3b8">  Measures: lat, lon, alt</text>
    <text x="24" y="318" font-family="monospace" font-size="9.5" fill="#fbbf24">  ±2 cm theoretical spec</text>
  </g>

  <!-- MIDDLE EKF ARCHITECTURE -->
  <!-- Local EKF Node -->
  <g transform="translate(300, 100)" filter="url(#shadow2)">
    <rect width="250" height="155" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="32" rx="12" fill="#0369a1"/>
    <text x="125" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">ekf_filter_node_odom (Local EKF)</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">Sensor Inputs:</text>
    <text x="18" y="70" font-family="monospace" font-size="10" fill="#cbd5e1">• /odom (v_x, v_y)</text>
    <text x="18" y="86" font-family="monospace" font-size="10" fill="#cbd5e1">• /imu/data (ω_z, a_x)</text>
    <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#a7f3d0">State Estimation Output:</text>
    <text x="18" y="124" font-family="monospace" font-size="10" fill="#e2e8f0">→ /odometry/local (30 Hz continuous)</text>
    <text x="18" y="142" font-family="monospace" font-size="10.5" font-weight="700" fill="#38bdf8">→ TF: odom → base_footprint</text>
  </g>

  <!-- NavSat Transform Node -->
  <g transform="translate(300, 280)" filter="url(#shadow2)">
    <rect width="250" height="75" rx="10" fill="url(#cardGrad2)" stroke="#34d399" stroke-width="1.2"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#34d399">navsat_transform_node</text>
    <text x="18" y="44" font-family="monospace" font-size="10" fill="#cbd5e1">Input: /gps/fix + /imu/data + datum</text>
    <text x="18" y="62" font-family="monospace" font-size="10" fill="#a7f3d0">Output: /odometry/gps (Cartesian UTM)</text>
  </g>

  <!-- Global EKF Node -->
  <g transform="translate(300, 380)" filter="url(#shadow2)">
    <rect width="250" height="155" rx="12" fill="url(#cardGrad2)" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="32" rx="12" fill="#7e22ce"/>
    <text x="125" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">ekf_filter_node_map (Global EKF)</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#c084fc">Sensor Inputs:</text>
    <text x="18" y="70" font-family="monospace" font-size="10" fill="#cbd5e1">• /odometry/local (continuous odom)</text>
    <text x="18" y="86" font-family="monospace" font-size="10" fill="#cbd5e1">• /odometry/gps (UTM metric x, y)</text>
    <text x="18" y="102" font-family="monospace" font-size="10" fill="#cbd5e1">• /imu/data (absolute compass yaw)</text>
    <text x="18" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#fde68a">Global Output:</text>
    <text x="18" y="142" font-family="monospace" font-size="10.5" font-weight="700" fill="#c084fc">→ TF: map → odom (30 Hz)</text>
  </g>

  <!-- Connecting Lines -->
  <!-- Sensor -> Local EKF -->
  <path d="M 250 180 L 300 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 250 210 L 275 210 L 275 190 L 300 190" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  
  <!-- GPS -> NavSat -> Global EKF -->
  <path d="M 250 315 L 300 315" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 425 355 L 425 380" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 500 255 L 525 255 L 525 380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- RIGHT COLUMN: REP-105 TF TREE & EQUATIONS -->
  <g transform="translate(590, 100)" filter="url(#shadow2)">
    <rect width="450" height="435" rx="12" fill="url(#cardGrad2)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="450" height="34" rx="12" fill="#334155"/>
    <text x="225" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">REP-105 TF TREE &amp; MATHEMATICAL EQUATIONS</text>

    <!-- TF Frame Diagram -->
    <rect x="20" y="48" width="410" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">REP-105 Coordinate Frame Ownership</text>
    
    <!-- TF Tree Nodes -->
    <rect x="35" y="85" width="70" height="32" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="70" y="105" font-family="monospace" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">map</text>

    <path d="M 105 101 L 135 101" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <text x="120" y="93" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">ekf_map</text>

    <rect x="140" y="85" width="70" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="175" y="105" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">odom</text>

    <path d="M 210 101 L 240 101" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="225" y="93" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">ekf_odom</text>

    <rect x="245" y="85" width="105" height="32" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="297" y="105" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">base_footprint</text>

    <path d="M 350 101 L 375 101" stroke="#64748b" stroke-width="1.5"/>
    <rect x="375" y="85" width="45" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="397" y="105" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">base</text>

    <!-- Sub-frames -->
    <path d="M 397 117 L 397 135" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 320 135 L 420 135" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 320 135 L 320 150" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 370 135 L 370 150" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 420 135 L 420 150" stroke="#64748b" stroke-width="1.5"/>

    <text x="320" y="165" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">lidar_link</text>
    <text x="370" y="165" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">imu_link</text>
    <text x="420" y="165" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">gps_link</text>

    <text x="32" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#e2e8f0">
      Zero TF conflict: ekf_node_odom owns odom→base_footprint; ekf_node_map owns map→odom.
    </text>

    <!-- Discrete EKF Equations -->
    <rect x="20" y="208" width="410" height="212" rx="8" fill="#0b1329" stroke="#1e3a8a" stroke-width="1"/>
    <text x="32" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#93c5fd">Discrete Extended Kalman Filter Formulations</text>

    <text x="32" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#f8fafc">1. Time Update (Prediction Step):</text>
    <text x="42" y="268" font-family="monospace" font-size="10" fill="#38bdf8">x̂_k|k-1 = f(x̂_k-1|k-1, u_k)</text>
    <text x="42" y="284" font-family="monospace" font-size="10" fill="#38bdf8">P_k|k-1 = F_k · P_k-1|k-1 · F_k^T + Q_k</text>

    <text x="32" y="306" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#f8fafc">2. Measurement Update (Innovation &amp; Kalman Gain):</text>
    <text x="42" y="324" font-family="monospace" font-size="10" fill="#c084fc">y_k = z_k - h(x̂_k|k-1)  [Innovation residual]</text>
    <text x="42" y="340" font-family="monospace" font-size="10" fill="#c084fc">S_k = H_k · P_k|k-1 · H_k^T + R_k  [Covariance]</text>
    <text x="42" y="356" font-family="monospace" font-size="10" fill="#c084fc">K_k = P_k|k-1 · H_k^T · S_k^-1  [Kalman Gain]</text>

    <text x="32" y="378" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#f8fafc">3. State &amp; Covariance Correction:</text>
    <text x="42" y="394" font-family="monospace" font-size="10" fill="#34d399">x̂_k|k = x̂_k|k-1 + K_k · y_k</text>
    <text x="42" y="410" font-family="monospace" font-size="10" fill="#34d399">P_k|k = (I - K_k · H_k) · P_k|k-1</text>
  </g>

  <!-- Bottom Clarification Box -->
  <rect x="40" y="550" width="1000" height="52" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2"/>
  <text x="55" y="570" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Critical Engineering Qualification on Wheel Scrubbing &amp; Slip:</text>
  <text x="55" y="588" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#e0e7ff">
    Fusing IMU angular rate (ω_z) into ekf_filter_node_odom significantly bounds yaw drift caused by differential tire scrubbing. However, the EKF does NOT eliminate physical friction limits or tire slip on tarmac.
  </text>
</svg>
