<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1020 680" style="width: 100%; min-width: 880px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;" xmlns="http://www.w3.org/2000/svg">
              
              <defs>
                <pattern id="grid48" width="20" height="20" patternUnits="userSpaceOnUse">
                  <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"></path>
                </pattern>
              </defs>
              <rect width="1020" height="680" fill="#0b1120" rx="8"></rect>
              <rect width="1020" height="680" fill="url(#grid48)" rx="8"></rect>

              <!-- STAGE 1: 48V BATTERY & MASTER PROTECTION -->
              <!-- 48V 20Ah Battery -->
              <rect x="25" y="220" width="175" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2.5"></rect>
              <text x="112" y="248" fill="#10b981" font-size="13" font-weight="bold" text-anchor="middle">48V 20Ah LiFePO4</text>
              <text x="112" y="268" fill="#e2e8f0" font-size="11" text-anchor="middle">16S Pack • 960–1024 Wh</text>
              <rect x="38" y="285" width="148" height="35" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"></rect>
              <text x="112" y="307" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">BMS 6S–22S 100A</text>
              <text x="112" y="340" fill="#94a3b8" font-size="10" text-anchor="middle">Dedicated 48V CC/CV Port</text>
              <text x="112" y="380" fill="#cbd5e1" font-size="9" text-anchor="middle">Integrated Cell Balancing</text>

              <!-- 8 AWG Main Fuse 100A -->
              <rect x="225" y="280" width="75" height="42" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"></rect>
              <text x="262" y="300" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">8 AWG FUSE</text>
              <text x="262" y="313" fill="#cbd5e1" font-size="9" text-anchor="middle">100A Main</text>

              <!-- Master 100A Kill Switch -->
              <rect x="325" y="265" width="90" height="70" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2"></rect>
              <text x="370" y="292" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">KILL SWITCH</text>
              <text x="370" y="308" fill="#fca5a5" font-size="10" text-anchor="middle">100A Disconnect</text>
              <text x="370" y="324" fill="#94a3b8" font-size="9" text-anchor="middle">Wireless Remote Rx</text>

              <!-- Power Bus Wires: Battery to Fuse to Kill Switch to PDB -->
              <path d="M 200 300 L 225 300" stroke="#ef4444" stroke-width="3.5" fill="none"></path>
              <path d="M 300 300 L 325 300" stroke="#ef4444" stroke-width="3.5" fill="none"></path>
              <path d="M 415 300 L 460 300" stroke="#ef4444" stroke-width="3.5" fill="none"></path>

              <!-- STAGE 2: 48V POWER DISTRIBUTION (XT60 & ANM FUSE BOX) -->
              <rect x="460" y="40" width="160" height="600" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="2"></rect>
              <text x="540" y="68" fill="#a78bfa" font-size="13" font-weight="bold" text-anchor="middle">POWER DISTRIBUTION</text>
              <text x="540" y="86" fill="#94a3b8" font-size="10" text-anchor="middle">XT60 / XT30 PDB &amp; ANM Box</text>

              <!-- ANM 50A Fuse 1: Motor Driver -->
              <rect x="475" y="105" width="130" height="45" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"></rect>
              <text x="540" y="125" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">50A ANM FUSE (1)</text>
              <text x="540" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">48V ZLAC8015D Driver</text>

              <!-- ANM 50A Fuse 2: 2800W Vacuum -->
              <rect x="475" y="165" width="130" height="45" rx="5" fill="#1e293b" stroke="#f97316" stroke-width="1.5"></rect>
              <text x="540" y="185" fill="#f97316" font-size="11" font-weight="bold" text-anchor="middle">50A ANM FUSE (2)</text>
              <text x="540" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">48V Vacuum (via SSR)</text>

              <!-- 20V Buck Converter (Hilbert's Laptop) -->
              <rect x="475" y="230" width="130" height="52" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"></rect>
              <text x="540" y="250" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">20V BUCK (10A)</text>
              <text x="540" y="264" fill="#fef08a" font-size="9" font-weight="bold" text-anchor="middle">→ HILBERT LAPTOP</text>
              <text x="540" y="276" fill="#94a3b8" font-size="8" text-anchor="middle">15A Blade Fuse Protected</text>

              <!-- 12V Buck Converter -->
              <rect x="475" y="300" width="130" height="52" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"></rect>
              <text x="540" y="320" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">12V BUCK (15A)</text>
              <text x="540" y="335" fill="#94a3b8" font-size="9" text-anchor="middle">Aux Rail &amp; Lighting</text>
              <text x="540" y="347" fill="#94a3b8" font-size="8" text-anchor="middle">10A Blade Fuse Protected</text>

              <!-- 5V Buck Converter -->
              <rect x="475" y="370" width="130" height="50" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1.5"></rect>
              <text x="540" y="390" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">5V BUCK (5A)</text>
              <text x="540" y="405" fill="#94a3b8" font-size="9" text-anchor="middle">MCU, GPS &amp; Sensor Logic</text>

              <!-- Ground Star Point -->
              <rect x="475" y="555" width="130" height="65" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1.5"></rect>
              <text x="540" y="580" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">STAR GROUND</text>
              <text x="540" y="596" fill="#64748b" font-size="9" text-anchor="middle">Central Return Point</text>
              <text x="540" y="609" fill="#64748b" font-size="8" text-anchor="middle">Isolates Motor Inrush Spikes</text>

              <!-- STAGE 3: ACTUATORS & CONSUMERS -->
              <!-- 1. Hub Motors & ZLAC8015D Servo Driver -->
              <rect x="700" y="70" width="290" height="90" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"></rect>
              <text x="845" y="94" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">ZLAC8015D V4.2 SERVO DRIVER</text>
              <text x="845" y="112" fill="#e2e8f0" font-size="11" text-anchor="middle">Dual Hub Motors: ZLLG80ASM25 0-HT V2.0</text>
              <text x="845" y="130" fill="#94a3b8" font-size="10" text-anchor="middle">8" Direct Drive • CAN Bus Interface • ≥10 km/h</text>
              <text x="845" y="146" fill="#64748b" font-size="9" text-anchor="middle">Suspension Shock Absorbers • TPU 98A Dampers</text>

              <!-- 2. 2800W Vacuum -->
              <rect x="700" y="175" width="290" height="65" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5"></rect>
              <text x="845" y="198" fill="#f97316" font-size="12" font-weight="bold" text-anchor="middle">2800W INDUSTRIAL VACUUM</text>
              <text x="845" y="216" fill="#e2e8f0" font-size="10.5" text-anchor="middle">48V Switched via 10A Solid State Relay (SSR)</text>
              <text x="845" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">High-Volume Suction Intake for Heavy Airfield FOD</text>

              <!-- 3. HILBERT'S LAPTOP (UGV PC) -->
              <rect x="700" y="255" width="290" height="110" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"></rect>
              <text x="845" y="280" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle">UGV ONBOARD PC: HILBERT'S LAPTOP</text>
              <text x="845" y="298" fill="#fef08a" font-size="11" font-weight="bold" text-anchor="middle">Internal Battery Powered (Isolated from 48V)</text>
              <text x="845" y="318" fill="#cbd5e1" font-size="10" text-anchor="middle">Runs: ROS 2 Jazzy (Ubuntu 24.04) • Nav2 • SLAM</text>
              <text x="845" y="334" fill="#94a3b8" font-size="9" text-anchor="middle">USB Link to STM32 F446RE • Ethernet RJ45</text>
              <text x="845" y="348" fill="#f87171" font-size="8.5" font-weight="bold" text-anchor="middle">Constraint: Budget limits new Jetson; EDIC Jetsons used in CDE3301</text>

              <!-- 4. 12V Auxiliary Devices -->
              <rect x="700" y="380" width="290" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"></rect>
              <text x="845" y="402" fill="#38bdf8" font-size="11.5" font-weight="bold" text-anchor="middle">12V AUXILIARY &amp; LIGHTING RAIL</text>
              <text x="845" y="420" fill="#cbd5e1" font-size="10" text-anchor="middle">5-Port Ethernet Switch • Dual Bay Cooling Fans</text>
              <text x="845" y="436" fill="#cbd5e1" font-size="10" text-anchor="middle">Headlights for CV • Indicator Light Tower • Rear Light Strip</text>
              <text x="845" y="452" fill="#94a3b8" font-size="9" text-anchor="middle">Controlled via STM32 F446RE &amp; Solid State Relay (SSR)</text>

              <!-- 5. 5V Sensors & Interfaces -->
              <rect x="700" y="480" width="290" height="120" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"></rect>
              <text x="845" y="504" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle">STM32 F446RE MCU &amp; SENSORS</text>
              <text x="845" y="524" fill="#e2e8f0" font-size="10.5" text-anchor="middle">STM32 F446RE • micro-ROS Firmware</text>
              <text x="845" y="542" fill="#cbd5e1" font-size="10" text-anchor="middle">CAN Transceiver to ZLAC8015D • USB to Laptop</text>
              <text x="845" y="560" fill="#cbd5e1" font-size="10" text-anchor="middle">UM980 RTK GPS • LI-IMX568 Camera Deserialiser</text>
              <text x="845" y="578" fill="#94a3b8" font-size="9" text-anchor="middle">UART Debug • Wireless ESC Remote Receiver</text>

              <!-- Connection Wires -->
              <!-- 48V to Motor Driver -->
              <path d="M 605 125 L 700 125" stroke="#ef4444" stroke-width="2.5" fill="none"></path>
              <!-- 48V to Vacuum -->
              <path d="M 605 190 L 700 190" stroke="#f97316" stroke-width="2.5" fill="none"></path>
              <!-- 20V Aux Buck Port (Available for bench testing) -->
              <path d="M 605 255 L 670 255" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3" fill="none"></path>
              <text x="640" y="248" fill="#f59e0b" font-size="8.5">Aux 20V</text>
              <!-- 12V to Aux -->
              <path d="M 605 325 L 660 325 L 660 420 L 700 420" stroke="#38bdf8" stroke-width="2" fill="none"></path>
              <!-- 5V to Sensors & MCU -->
              <path d="M 605 395 L 670 395 L 670 540 L 700 540" stroke="#10b981" stroke-width="2" fill="none"></path>

              <!-- Data Bus: USB from Laptop to STM32 F446RE -->
              <path d="M 845 365 L 845 480" stroke="#f59e0b" stroke-width="2.5" fill="none"></path>
              <text x="855" y="425" fill="#fef08a" font-size="9.5" font-weight="bold">USB Link (cmd_vel • Telemetry)</text>

              <!-- CAN Bus from STM32 F446RE up to ZLAC8015D Motor Driver -->
              <path d="M 970 480 L 970 160" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4" fill="none"></path>
              <text x="978" y="320" fill="#c4b5fd" font-size="9" font-weight="bold" transform="rotate(-90 978,320)" text-anchor="middle">CAN Bus (Motor Control Loop)</text>
            </svg>
