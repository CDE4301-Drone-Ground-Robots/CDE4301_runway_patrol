<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 420" role="img" aria-label="Forces acting on the corner mass: acceleration, spring and damper forces, with road profile x(t) as input and chassis displacement y(t) as output" style="width: 100%; max-width: 620px; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', sans-serif;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f8fafc"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker>
  </defs>
  <rect x="250" y="100" width="120" height="50" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
  <g fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">
    <text x="310" y="121">Corner</text>
    <text x="310" y="140">Mass</text>
  </g>
  <g fill="none" stroke="#f8fafc" stroke-width="2.5">
    <path d="M310 150 V175 M270 175 H350 M270 175 V205 l-10 6 l20 12 l-20 12 l20 12 l-10 6 V325 M350 175 V245 M340 245 H360 M338 230 V285 H362 V230 M350 285 V325"/>
  </g>
  <g fill="none" stroke-width="3" marker-end="url(#arr)">
    <line x1="310" y1="95" x2="310" y2="55" stroke="#60a5fa" marker-end="url(#arr-blue)"/>
    <line x1="228" y1="108" x2="228" y2="148" stroke="#f8fafc"/>
    <line x1="245" y1="215" x2="245" y2="258" stroke="#f8fafc"/>
    <line x1="388" y1="215" x2="388" y2="258" stroke="#f8fafc"/>
    <line x1="450" y1="318" x2="450" y2="268" stroke="#f8fafc"/>
  </g>
  <g fill="#f8fafc" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="18">
    <text x="212" y="134" text-anchor="end">F<tspan dy="5" font-size="13">acceleration</tspan></text>
    <text x="231" y="248" text-anchor="end">F<tspan dy="5" font-size="13">Spring</tspan></text>
    <text x="396" y="210">F<tspan dy="5" font-size="13">damper</tspan></text>
  </g>
  <g fill="#f8fafc" font-size="15" font-weight="700">
    <text x="330" y="72">Chassis Displacement</text>
    <text x="330" y="92" font-family="'Times New Roman', Times, serif" font-style="italic" font-weight="400" font-size="18">y(t) <tspan font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-style="normal" font-weight="700" font-size="15">(Output)</tspan></text>
    <text x="462" y="290">Road Profile <tspan font-family="'Times New Roman', Times, serif" font-style="italic" font-weight="400" font-size="18">x(t)</tspan></text>
    <text x="462" y="310">(input)</text>
  </g>
  <rect x="120" y="325" width="440" height="90" fill="#a3a3a3"/>
  <text x="340" y="376" fill="#111" font-size="16" font-weight="700" text-anchor="middle">Ground</text>
</svg>
