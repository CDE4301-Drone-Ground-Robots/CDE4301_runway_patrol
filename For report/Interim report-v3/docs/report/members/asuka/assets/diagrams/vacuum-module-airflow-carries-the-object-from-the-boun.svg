<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 440 340" role="img" aria-label="Airflow carries the object from the bounding box opening down a tube inclined at angle theta into the bin. Free body diagram: drag force along the tube, weight downwards, normal force perpendicular to the tube." style="width: 100%; max-width: 460px; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <marker id="vac-arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"></path></marker>
                  <marker id="vac-arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"></path></marker>
                </defs>
                <rect x="0" y="120" width="70" height="140" fill="rgba(59, 130, 246, 0.4)"></rect>
                <text x="35" y="196" text-anchor="middle" font-size="16" fill="#e5e7eb">Bin</text>
                <g stroke="#e5e7eb" stroke-width="2.5"><line x1="70" y1="150" x2="270" y2="70"></line><line x1="70" y1="232" x2="270" y2="152"></line><line x1="70" y1="232" x2="125" y2="232"></line></g>
                <path d="M108 232 A38 38 0 0 0 105 218" fill="none" stroke="#e5e7eb" stroke-width="1.5"></path>
                <text x="114" y="226" font-size="13" font-style="italic" fill="#e5e7eb">θ</text>
                <text x="205" y="196" font-size="13" fill="#e5e7eb">Tube</text>
                <rect x="250" y="20" width="110" height="160" fill="rgba(245, 158, 11, 0.16)" stroke="#f59e0b" stroke-width="1.5"></rect>
                <text x="305" y="104" text-anchor="middle" font-size="14" fill="#e5e7eb">Bounding</text><text x="305" y="122" text-anchor="middle" font-size="14" fill="#e5e7eb">Box</text>
                <rect x="300" y="32" width="52" height="30" rx="3" fill="rgba(59, 130, 246, 0.16)" stroke="#3b82f6" stroke-width="1.5"></rect>
                <text x="326" y="51" text-anchor="middle" font-size="11" fill="#e5e7eb">Opening</text>
                <ellipse cx="160" cy="152" rx="30" ry="18" fill="rgba(239, 68, 68, 0.16)" stroke="#ef4444" stroke-width="1.5"></ellipse>
                <text x="160" y="156" text-anchor="middle" font-size="12" fill="#e5e7eb">Object</text>
                <text x="130" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#3b82f6">Airflow</text>
                <g stroke="#3b82f6" stroke-width="2" marker-end="url(#vac-arr2)">
                  <line x1="425" y1="20" x2="372" y2="42"></line><line x1="425" y1="40" x2="372" y2="58"></line>
                  <line x1="240" y1="120" x2="205" y2="134"></line><line x1="125" y1="185" x2="90" y2="199"></line><line x1="230" y1="160" x2="195" y2="174"></line>
                </g>
                <!-- axes at the object: x along the tube towards the bin, y normal to the tube -->
                <g stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#vac-arr3)">
                  <line x1="415" y1="300" x2="378" y2="315"></line>
                  <line x1="415" y1="300" x2="400" y2="263"></line>
                </g>
                <text x="368" y="324" font-size="12" font-style="italic" fill="#e5e7eb">x</text>
                <text x="392" y="259" font-size="12" font-style="italic" fill="#e5e7eb">y</text>
                <!-- free body diagram -->
                <circle cx="330" cy="270" r="16" fill="rgba(239, 68, 68, 0.16)" stroke="#ef4444" stroke-width="1.5"></circle>
                <text x="330" y="274" text-anchor="middle" font-size="11" fill="#e5e7eb">obj</text>
                <g stroke-width="2" marker-end="url(#vac-arr3)">
                  <line x1="330" y1="286" x2="330" y2="326" stroke="#e5e7eb"></line>
                  <line x1="324" y1="255" x2="309" y2="218" stroke="#e5e7eb"></line>
                  <line x1="315" y1="276" x2="275" y2="292" stroke="#3b82f6"></line>
                </g>
                <text x="338" y="330" font-size="12" font-style="italic" fill="#e5e7eb">W</text>
                <text x="300" y="214" font-size="12" font-style="italic" fill="#e5e7eb">N</text>
                <text x="262" y="308" font-size="12" font-style="italic" fill="#3b82f6">F<tspan font-size="9" dy="3">D</tspan></text>
              </svg>
