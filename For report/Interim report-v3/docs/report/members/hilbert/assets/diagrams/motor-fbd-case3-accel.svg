<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="auto" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="c3-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="c3-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="c3-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="c3-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="660" height="320" rx="12" fill="#090f1d" stroke="#334155" stroke-width="1.5" filter="url(#c3-shadow)"/>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Case 3: Flat Dynamic Acceleration (0 to 15 km/h in 3.0 s)</text>
  <text x="340" y="52" text-anchor="middle" fill="#94a3b8" font-size="11.5">Overcoming Inertial Force (F_acc = m·a) + Rolling and Aerodynamic Resistances</text>

  <!-- Ground Plane -->
  <line x1="60" y1="245" x2="620" y2="245" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="265" fill="#64748b" font-size="10" text-anchor="end">Runway Surface • Acceleration a = 1.389 m/s²</text>

  <!-- Chassis Body -->
  <rect x="180" y="110" width="320" height="95" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="340" y="142" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">FOD HUNTER (m = 65.0 kg)</text>
  <text x="340" y="160" text-anchor="middle" fill="#94a3b8" font-size="10.5">Inertial D'Alembert Force: F_acc = 90.28 N</text>

  <!-- Wheels -->
  <circle cx="240" cy="205" r="40" fill="#020617" stroke="#10b981" stroke-width="3"/>
  <circle cx="240" cy="205" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="440" cy="205" r="40" fill="#020617" stroke="#10b981" stroke-width="3"/>
  <circle cx="440" cy="205" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Acceleration Vector -->
  <line x1="340" y1="85" x2="450" y2="85" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#c3-blue)"/>
  <text x="460" y="89" fill="#38bdf8" font-size="11" font-weight="700">a = 1.389 m/s² (t_acc = 3.0 s)</text>

  <!-- Inertial Force Arrow (Acting Backwards through CG) -->
  <line x1="340" y1="150" x2="230" y2="150" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#c3-rose)"/>
  <text x="220" y="145" fill="#f43f5e" font-size="10.5" font-weight="700" text-anchor="end">F_acc = 90.28 N</text>

  <!-- Tractive Drive Force (Forward) -->
  <line x1="440" y1="245" x2="550" y2="245" stroke="#10b981" stroke-width="3" marker-end="url(#c3-green)"/>
  <text x="555" y="241" fill="#10b981" font-size="11" font-weight="700">F_total = 109.15 N</text>
  <text x="555" y="255" fill="#6ee7b7" font-size="9.5">(tau_motor = 4.22 Nm per hub)</text>

  <!-- Summary Badge Box -->
  <rect x="50" y="280" width="580" height="35" rx="6" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1"/>
  <text x="340" y="302" text-anchor="middle" fill="#f8fafc" font-size="11">
    <tspan font-weight="700" fill="#38bdf8">Total Force:</tspan> 109.15 N | 
    <tspan font-weight="700" fill="#38bdf8">Torque / Motor:</tspan> 4.22 Nm | 
    <tspan font-weight="700" fill="#10b981">P_mech (Peak):</tspan> 454.8 W | 
    <tspan font-weight="700" fill="#f59e0b">Peak Headroom:</tspan> 6.75x margin below 28.5 Nm peak
  </text>
</svg>