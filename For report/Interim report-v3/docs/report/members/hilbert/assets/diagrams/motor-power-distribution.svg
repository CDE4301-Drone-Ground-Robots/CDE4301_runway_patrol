<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="100%" height="auto" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="pwr-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="pwr-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pwr-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="pwr-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="pwr-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="pwr-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="760" height="440" rx="14" fill="#090f1d" stroke="#334155" stroke-width="1.5" filter="url(#pwr-shadow)"/>

  <!-- Title & Subtitle -->
  <text x="390" y="36" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Four-Motor Electrical Power &amp; CAN Bus Architecture</text>
  <text x="390" y="54" text-anchor="middle" fill="#94a3b8" font-size="11.5">48V LiFePO4 Energy Storage, Dual ZLAC8015D Servo Inverters &amp; ZLLG80 Hub Motors</text>

  <!-- BATTERY PACK CARD -->
  <g transform="translate(40, 75)">
    <rect width="210" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="210" height="26" rx="8" fill="rgba(245,158,11,0.2)"/>
    <text x="105" y="18" text-anchor="middle" fill="#f59e0b" font-size="11.5" font-weight="700">48V 20Ah LiFePO4 Battery</text>
    <text x="12" y="44" fill="#e2e8f0" font-size="11" font-weight="600">• Nominal Capacity: 960 Wh</text>
    <text x="12" y="62" fill="#e2e8f0" font-size="11" font-weight="600">• Continuous BMS: 80.0 A</text>
    <text x="12" y="80" fill="#e2e8f0" font-size="11" font-weight="600">• Peak Surge BMS: 120.0 A</text>
    <text x="12" y="98" fill="#94a3b8" font-size="10">Operating Range: 42.0V - 54.6V</text>
  </g>

  <!-- MAIN 48V DC BUS TRACE -->
  <line x1="250" y1="130" x2="310" y2="130" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#pwr-arrow-amber)"/>
  <text x="280" y="122" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">48V BUS</text>

  <!-- DC BUS SPLITTER & FUSES -->
  <rect x="310" y="95" width="60" height="260" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="115" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-weight="700">DC BUS</text>
  <circle cx="340" cy="140" r="5" fill="#f59e0b"/>
  <circle cx="340" cy="225" r="5" fill="#f59e0b"/>
  <circle cx="340" cy="310" r="5" fill="#f59e0b"/>

  <!-- AUXILIARY LOAD BRANCH (BOTTOM) -->
  <line x1="340" y1="310" x2="160" y2="310" stroke="#38bdf8" stroke-width="2" marker-end="url(#pwr-arrow-blue)"/>
  <rect x="40" y="270" width="180" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="130" y="290" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Auxiliary Payloads (~350W)</text>
  <text x="50" y="310" fill="#e2e8f0" font-size="10">• Vacuum Blower: ~250W (5.2A)</text>
  <text x="50" y="326" fill="#e2e8f0" font-size="10">• Jetson + LiDAR + RTK: ~80W</text>
  <text x="50" y="342" fill="#94a3b8" font-size="9.5">Isolated 48V to 12V/24V DC-DC</text>

  <!-- DRIVER 1: FRONT AXLE (NODE ID 1) -->
  <g transform="translate(400, 75)">
    <rect width="170" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="170" height="24" rx="8" fill="rgba(56,189,248,0.2)"/>
    <text x="85" y="17" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">ZLAC8015D Driver 1</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">CAN Node ID: 1 (Front)</text>
    <text x="10" y="58" fill="#e2e8f0" font-size="10.5">• CH1: Front-Left Motor</text>
    <text x="10" y="74" fill="#e2e8f0" font-size="10.5">• CH2: Front-Right Motor</text>
    <text x="10" y="90" fill="#10b981" font-size="10" font-weight="700">Clamp: 16.0 A / Channel</text>
    <text x="10" y="104" fill="#94a3b8" font-size="9">Dual-Channel FOC Vector</text>
  </g>
  <line x1="370" y1="130" x2="400" y2="130" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#pwr-arrow-amber)"/>

  <!-- DRIVER 2: REAR AXLE (NODE ID 2) -->
  <g transform="translate(400, 215)">
    <rect width="170" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="170" height="24" rx="8" fill="rgba(56,189,248,0.2)"/>
    <text x="85" y="17" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">ZLAC8015D Driver 2</text>
    <text x="10" y="42" fill="#e2e8f0" font-size="10.5" font-weight="600">CAN Node ID: 2 (Rear)</text>
    <text x="10" y="58" fill="#e2e8f0" font-size="10.5">• CH1: Rear-Left Motor</text>
    <text x="10" y="74" fill="#e2e8f0" font-size="10.5">• CH2: Rear-Right Motor</text>
    <text x="10" y="90" fill="#10b981" font-size="10" font-weight="700">Clamp: 16.0 A / Channel</text>
    <text x="10" y="104" fill="#94a3b8" font-size="9">Dual-Channel FOC Vector</text>
  </g>
  <line x1="370" y1="270" x2="400" y2="270" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#pwr-arrow-amber)"/>

  <!-- 4 HUB MOTORS -->
  <!-- FL Motor -->
  <g transform="translate(610, 65)">
    <rect width="135" height="55" rx="6" fill="#020617" stroke="#10b981" stroke-width="2"/>
    <text x="67" y="20" text-anchor="middle" fill="#10b981" font-size="10.5" font-weight="700">Front-Left Hub</text>
    <text x="67" y="35" text-anchor="middle" fill="#e2e8f0" font-size="9.5">ZLLG80ASM250</text>
    <text x="67" y="48" text-anchor="middle" fill="#94a3b8" font-size="8.5">4096-Line Encoder</text>
  </g>
  <line x1="570" y1="95" x2="610" y2="95" stroke="#10b981" stroke-width="2" marker-end="url(#pwr-arrow-green)"/>

  <!-- FR Motor -->
  <g transform="translate(610, 135)">
    <rect width="135" height="55" rx="6" fill="#020617" stroke="#f43f5e" stroke-width="2"/>
    <text x="67" y="20" text-anchor="middle" fill="#f43f5e" font-size="10.5" font-weight="700">Front-Right Hub</text>
    <text x="67" y="35" text-anchor="middle" fill="#e2e8f0" font-size="9.5">ZLLG80ASM250</text>
    <text x="67" y="48" text-anchor="middle" fill="#94a3b8" font-size="8.5">Mirrored Polarities</text>
  </g>
  <line x1="570" y1="160" x2="610" y2="160" stroke="#f43f5e" stroke-width="2" marker-end="url(#pwr-arrow-green)"/>

  <!-- RL Motor -->
  <g transform="translate(610, 205)">
    <rect width="135" height="55" rx="6" fill="#020617" stroke="#10b981" stroke-width="2"/>
    <text x="67" y="20" text-anchor="middle" fill="#10b981" font-size="10.5" font-weight="700">Rear-Left Hub</text>
    <text x="67" y="35" text-anchor="middle" fill="#e2e8f0" font-size="9.5">ZLLG80ASM250</text>
    <text x="67" y="48" text-anchor="middle" fill="#94a3b8" font-size="8.5">4096-Line Encoder</text>
  </g>
  <line x1="570" y1="235" x2="610" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#pwr-arrow-green)"/>

  <!-- RR Motor -->
  <g transform="translate(610, 275)">
    <rect width="135" height="55" rx="6" fill="#020617" stroke="#f43f5e" stroke-width="2"/>
    <text x="67" y="20" text-anchor="middle" fill="#f43f5e" font-size="10.5" font-weight="700">Rear-Right Hub</text>
    <text x="67" y="35" text-anchor="middle" fill="#e2e8f0" font-size="9.5">ZLLG80ASM250</text>
    <text x="67" y="48" text-anchor="middle" fill="#94a3b8" font-size="8.5">Mirrored Polarities</text>
  </g>
  <line x1="570" y1="300" x2="610" y2="300" stroke="#f43f5e" stroke-width="2" marker-end="url(#pwr-arrow-green)"/>

  <!-- STM32 CAN CONTROL BUS (GREEN DASHED) -->
  <rect x="40" y="380" width="700" height="55" rx="8" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
  <text x="390" y="402" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">
    STM32F446RE MCU • CAN1 Bus at 500 kbps (PB8=RX, PB9=TX) • 50 Hz Synchronized Velocity Loop
  </text>
  <text x="390" y="422" text-anchor="middle" fill="#94a3b8" font-size="10">
    Continuous Cruise: 13.4 A Bus Current (641 W total) • Peak Pivot Transient: 66.3 A Bus Current (&lt; 80 A Continuous / 120 A Peak BMS Ceiling)
  </text>
</svg>