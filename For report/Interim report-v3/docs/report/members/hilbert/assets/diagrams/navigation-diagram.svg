<?xml version="1.0" encoding="UTF-8"?>
<svg height="200" style="max-width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, sans-serif;" viewBox="0 0 1020 200" width="1020" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="6" refY="5" viewBox="0 0 10 10">
<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"></path>
</marker>
</defs>
<!-- Stage 1: Perception -->
<rect fill="rgba(59, 130, 246, 0.08)" height="110" rx="8" stroke="#3b82f6" stroke-width="1.5" width="140" x="10" y="40"></rect>
<text fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle" x="80" y="65">1. PERCEPTION</text>
<text fill="#94a3b8" font-size="11" text-anchor="middle" x="80" y="85">Hesai JT16 3D LiDAR</text>
<text fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle" x="80" y="103">/scan (LaserScan)</text>
<text fill="#94a3b8" font-size="10" text-anchor="middle" x="80" y="121">Raytrace &amp; Clearing</text>
<!-- Arrow 1 -> Costmap -->
<line marker-end="url(#arrow)" stroke="#3b82f6" stroke-width="1.5" x1="150" x2="190" y1="95" y2="95"></line>
<!-- Stage 2: Costmap & State -->
<rect fill="rgba(168, 85, 247, 0.08)" height="110" rx="8" stroke="#a855f7" stroke-width="1.5" width="155" x="195" y="40"></rect>
<text fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle" x="272" y="65">2. COSTMAP &amp; STATE</text>
<text fill="#94a3b8" font-size="10" text-anchor="middle" x="272" y="85">Global Costmap (1 Hz)</text>
<text fill="#94a3b8" font-size="10" text-anchor="middle" x="272" y="101">Local Rolling (5 Hz, 12m)</text>
<text fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle" x="272" y="119">Dual-EKF (map-&gt;odom)</text>
<!-- Arrow 2 -> Global Planner -->
<line marker-end="url(#arrow)" stroke="#3b82f6" stroke-width="1.5" x1="350" x2="390" y1="95" y2="95"></line>
<!-- Stage 3: Global Planning -->
<rect fill="rgba(16, 185, 129, 0.08)" height="110" rx="8" stroke="#10b981" stroke-width="1.5" width="160" x="395" y="40"></rect>
<text fill="#34d399" font-size="12" font-weight="700" text-anchor="middle" x="475" y="65">3. GLOBAL PLANNER</text>
<text fill="#94a3b8" font-size="11" text-anchor="middle" x="475" y="85">SmacPlannerHybrid</text>
<text fill="#94a3b8" font-size="10" text-anchor="middle" x="475" y="103">Reeds-Shepp Lattice</text>
<text fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle" x="475" y="121">R_min &gt;= 1.0 m</text>
<!-- Arrow 3 -> Controller -->
<line marker-end="url(#arrow)" stroke="#3b82f6" stroke-width="1.5" x1="555" x2="595" y1="95" y2="95"></line>
<!-- Stage 4: Local Controller -->
<rect fill="rgba(245, 158, 11, 0.08)" height="110" rx="8" stroke="#f59e0b" stroke-width="1.5" width="160" x="600" y="40"></rect>
<text fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle" x="680" y="65">4. LOCAL TRACKING</text>
<text fill="#94a3b8" font-size="11" text-anchor="middle" x="680" y="85">Regulated Pure Pursuit</text>
<text fill="#94a3b8" font-size="10" text-anchor="middle" x="680" y="103">Adaptive Lookahead L(v)</text>
<text fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle" x="680" y="121">20 Hz Control Loop</text>
<!-- Arrow 4 -> Actuation -->
<line marker-end="url(#arrow)" stroke="#3b82f6" stroke-width="1.5" x1="760" x2="800" y1="95" y2="95"></line>
<!-- Stage 5: Actuation & Hardware -->
<rect fill="rgba(239, 68, 68, 0.08)" height="110" rx="8" stroke="#ef4444" stroke-width="1.5" width="165" x="805" y="40"></rect>
<text fill="#f87171" font-size="12" font-weight="700" text-anchor="middle" x="887" y="65">5. ACTUATION &amp; HW</text>
<text fill="#f87171" font-family="monospace" font-size="10" text-anchor="middle" x="887" y="85">/cmd_vel (v, omega)</text>
<text fill="#94a3b8" font-size="10" text-anchor="middle" x="887" y="103">Skid-Steer Kinematics</text>
<text fill="#94a3b8" font-size="10" text-anchor="middle" x="887" y="121">4x BLDC Hub Motors</text>
<!-- Feedback Loop -->
<path d="M 887 150 L 887 180 L 272 180 L 272 150" fill="none" marker-end="url(#arrow)" stroke="rgba(255, 255, 255, 0.25)" stroke-dasharray="4" stroke-width="1.5"></path>
<text fill="#94a3b8" font-size="10.5" text-anchor="middle" x="580" y="174">Feedback: Wheel Encoders + IMU (/odometry/local at 50 Hz)</text>
</svg>
