<?xml version="1.0" encoding="UTF-8"?>
<svg style="display: block; margin: 0 auto; max-width: 100%; min-width: 760px; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;" viewBox="-100 0 1200 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .ekf-text-p { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .ekf-text-s { fill: #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <marker id="arrow-purple-ekf" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="6" refY="5" viewBox="0 0 10 10">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
  </marker>
</defs>
<!-- Top Left: Smooth local odometry input -->
<text class="ekf-text-p" fill="#FFFFFF" font-size="12.5" font-weight="600" text-anchor="end" x="245" y="56">Smooth local odometry</text>
<text class="ekf-text-s" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" text-anchor="end" x="245" y="72">/odometry/local</text>
<text class="ekf-text-s" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="9.5" text-anchor="end" x="245" y="86">[v<tspan dy="2" font-size="8">x</tspan><tspan dy="-2">, v</tspan><tspan dy="2" font-size="8">y</tspan><tspan dy="-2">, ω</tspan><tspan dy="2" font-size="8">z</tspan><tspan dy="-2">] (30 Hz)</tspan></text>
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="2" x1="255" x2="295" y1="65" y2="65"></line>

<!-- Block 1: Dead-reckoning prediction f(x, u) (White block) -->
<rect fill="#FFFFFF" height="54" rx="6" stroke="#a855f7" stroke-width="2" width="185" x="300" y="38"></rect>
<text fill="#0f172a" font-size="12.5" font-weight="700" text-anchor="middle" x="392" y="60">Dead-reckoning prediction</text>
<text fill="#7e22ce" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" x="392" y="78">f(x, u) state propagation</text>

<!-- Horizontal prior line to Summing Junction (+) -->
<line stroke="#c084fc" stroke-width="2" x1="485" x2="540" y1="65" y2="65"></line>
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="2" x1="540" x2="710" y1="65" y2="65"></line>
<text class="ekf-text-s" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle" x="625" y="54">Prior x̂⁻</text>

<!-- Downward branch into Observation model H -->
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="1.8" x1="540" x2="540" y1="65" y2="108"></line>

<!-- Block 2: Observation model H (White block) -->
<rect fill="#FFFFFF" height="48" rx="6" stroke="#a855f7" stroke-width="2" width="150" x="465" y="112"></rect>
<text fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle" x="540" y="132">Observation model</text>
<text fill="#7e22ce" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" x="540" y="148">H (Cartesian &amp; yaw)</text>

<!-- Downward arrow from Observation model to Subtraction Junction (-) -->
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="1.8" x1="540" x2="540" y1="160" y2="216"></line>
<text fill="#e9d5ff" font-size="10.5" x="552" y="190">Predicted position Hx̂⁻</text>

<!-- Subtraction Junction (-) (White circle) -->
<circle fill="#FFFFFF" cx="540" cy="232" r="14" stroke="#a855f7" stroke-width="2"></circle>
<text fill="#7e22ce" font-size="18" font-weight="bold" text-anchor="middle" x="540" y="238">−</text>

<!-- Bottom Left Input: RTK-GNSS + IMU heading -->
<text class="ekf-text-p" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="end" x="245" y="216">RTK-GNSS Cartesian + IMU</text>
<text class="ekf-text-s" fill="#CBD5E1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="end" x="245" y="232">/odometry/gps [x, y] + yaw</text>
<text fill="#fde68a" font-size="9.5" text-anchor="end" x="245" y="246">navsat_transform (56.3000°N, 10.6190°E)</text>
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="2" x1="255" x2="518" y1="232" y2="232"></line>

<!-- Innovation residual arrow to Kalman gain (K) -->
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="2" x1="555" x2="648" y1="232" y2="232"></line>
<text fill="#e9d5ff" font-size="10.5" text-anchor="middle" x="601" y="220">Innovation</text>
<text fill="#e9d5ff" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle" x="601" y="246">y = z<tspan dy="2" font-size="8">gps</tspan><tspan dy="-2"> − Hx̂⁻</tspan></text>

<!-- Block 3: Kalman gain (K) (White block with purple stroke) -->
<rect fill="#FFFFFF" height="48" rx="6" stroke="#a855f7" stroke-width="2" width="156" x="650" y="208"></rect>
<text fill="#7e22ce" font-size="12" font-weight="700" text-anchor="middle" x="728" y="228">Kalman gain (K)</text>
<text fill="#581c87" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600" text-anchor="middle" x="728" y="244">Optimal satellite weight</text>

<!-- Upward arrow from Kalman gain to Summing Junction (+) -->
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="2" x1="728" x2="728" y1="208" y2="82"></line>
<text fill="#c084fc" font-size="11" font-weight="600" x="740" y="142">Correction</text>
<text fill="#e9d5ff" font-family="'SF Mono', Consolas, monospace" font-size="11.5" x="740" y="158">K · y</text>

<!-- Summing Junction (+) (White circle with purple stroke) -->
<circle fill="#FFFFFF" cx="728" cy="65" r="14" stroke="#a855f7" stroke-width="2"></circle>
<text fill="#7e22ce" font-size="16" font-weight="bold" text-anchor="middle" x="728" y="70">+</text>

<!-- Exit Arrow to Global Pose -->
<line marker-end="url(#arrow-purple-ekf)" stroke="#c084fc" stroke-width="2" x1="742" x2="795" y1="65" y2="65"></line>
<text class="ekf-text-p" fill="#FFFFFF" font-size="13" font-weight="700" x="805" y="54">Global Pose (30 Hz)</text>
<text fill="#e9d5ff" font-family="'SF Mono', Consolas, monospace" font-size="11.5" x="805" y="72">/odometry/global</text>
<rect fill="rgba(168, 85, 247, 0.2)" height="24" rx="4" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1" width="124" x="803" y="82"></rect>
<text fill="#e9d5ff" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle" x="865" y="98">map → odom</text>
<text class="ekf-text-s" fill="#CBD5E1" font-size="10.5" x="805" y="122">Keeps local odometry separate</text>
</svg>
