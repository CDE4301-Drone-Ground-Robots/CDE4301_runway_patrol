<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #090D16; }
      .title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.06em; }
      .node-Title { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.03em; }
      .node-Code { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 13.5px; font-weight: 600; fill: #93C5FD; }
      .node-Sub { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #CBD5E1; }
      .edge-Bold { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
      .edge-Text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; font-weight: 500; fill: #CBD5E1; }
      .edge-Mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #FDE68A; }
      .pill { fill: #090D16; }
      .box-neutral { fill: #111827; stroke: #64748B; stroke-width: 2.5px; rx: 10px; }
      .box-lock { fill: #0F172A; stroke: #3B82F6; stroke-width: 2.5px; rx: 10px; }
      .box-move { fill: #06281E; stroke: #10B981; stroke-width: 2.5px; rx: 10px; }
      .box-err { fill: #2A0E17; stroke: #F43F5E; stroke-width: 2.5px; rx: 10px; }
      .box-jerk { fill: #271A09; stroke: #F59E0B; stroke-width: 2.5px; rx: 10px; }
      .line-std { stroke: #94A3B8; stroke-width: 2.2px; fill: none; stroke-linejoin: round; }
      .line-err { stroke: #F43F5E; stroke-width: 2.2px; fill: none; stroke-linejoin: round; }
      .line-jerk { stroke: #F59E0B; stroke-width: 2.2px; fill: none; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <marker id="arr-std" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
    </marker>
    <marker id="arr-err" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F43F5E" />
    </marker>
    <marker id="arr-jerk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1060" height="720" rx="14" class="bg" />

  <!-- Diagram Title -->
  <text x="530" y="52" text-anchor="middle" class="title">STATE MACHINE DIAGRAM FOR MOTOR</text>

  <!-- ==================== STATE NODES ==================== -->
  <!-- 1. DISENGAGE -->
  <g filter="url(#shadow)">
    <rect x="380" y="90" width="300" height="92" class="box-neutral" />
    <text x="530" y="132" text-anchor="middle" class="node-Title">DISENGAGE</text>
    <text x="530" y="156" text-anchor="middle" class="node-Code">0x00</text>
  </g>

  <!-- 2. LOCK -->
  <g filter="url(#shadow)">
    <rect x="380" y="250" width="300" height="104" class="box-lock" />
    <text x="530" y="286" text-anchor="middle" class="node-Title">LOCK</text>
    <text x="530" y="309" text-anchor="middle" class="node-Code">0x08</text>
    <text x="530" y="331" text-anchor="middle" class="node-Sub">No Input</text>
  </g>

  <!-- 3. MOVEMENT -->
  <g filter="url(#shadow)">
    <rect x="380" y="424" width="300" height="104" class="box-move" />
    <text x="530" y="460" text-anchor="middle" class="node-Title">MOVEMENT</text>
    <text x="530" y="483" text-anchor="middle" class="node-Code" fill="#6EE7B7">0x08</text>
    <text x="530" y="505" text-anchor="middle" class="node-Sub">RPM : Speed Input</text>
  </g>

  <!-- 4. ERR (Bottom Left) -->
  <g filter="url(#shadow)">
    <rect x="190" y="596" width="300" height="92" class="box-err" />
    <text x="340" y="638" text-anchor="middle" class="node-Title" fill="#FDA4AF">ERR</text>
    <text x="340" y="662" text-anchor="middle" class="node-Code" fill="#FECDD3">Register != 0x0000</text>
  </g>

  <!-- 5. JERK (Bottom Right) -->
  <g filter="url(#shadow)">
    <rect x="570" y="596" width="300" height="92" class="box-jerk" />
    <text x="720" y="638" text-anchor="middle" class="node-Title" fill="#FDE68A">JERK</text>
    <text x="720" y="662" text-anchor="middle" class="node-Code" fill="#FCD34D">0x05</text>
  </g>


  <!-- ==================== TRANSITIONS ==================== -->

  <!-- DISENGAGE -> LOCK (RUN 0x08) -->
  <line x1="530" y1="182" x2="530" y2="246" class="line-std" marker-end="url(#arr-std)" />
  <rect x="478" y="201" width="104" height="24" class="pill" />
  <text x="530" y="218" text-anchor="middle" class="edge-Bold">RUN <tspan class="edge-Mono">0x08</tspan></text>

  <!-- LOCK -> MOVEMENT (Speed Input != 0) -->
  <line x1="435" y1="354" x2="435" y2="420" class="line-std" marker-end="url(#arr-std)" />
  <rect x="368" y="375" width="134" height="24" class="pill" />
  <text x="435" y="391" text-anchor="middle" class="edge-Text">Speed Input != 0</text>

  <!-- MOVEMENT -> LOCK (Speed Input = 0) -->
  <line x1="625" y1="424" x2="625" y2="358" class="line-std" marker-end="url(#arr-std)" />
  <rect x="560" y="375" width="130" height="24" class="pill" />
  <text x="625" y="391" text-anchor="middle" class="edge-Text">Speed Input = 0</text>

  <!-- MOVEMENT -> ERR (OVERCURRENT / BIT FAULT) -->
  <line x1="425" y1="528" x2="425" y2="592" class="line-err" marker-end="url(#arr-err)" />
  <rect x="352" y="539" width="146" height="38" class="pill" />
  <text x="425" y="554" text-anchor="middle" class="edge-Bold" fill="#FDA4AF">OVERCURRENT /</text>
  <text x="425" y="572" text-anchor="middle" class="edge-Bold" fill="#FDA4AF">BIT FAULT</text>

  <!-- MOVEMENT -> JERK (QUICK STOP 0x05) -->
  <line x1="635" y1="528" x2="635" y2="592" class="line-jerk" marker-end="url(#arr-jerk)" />
  <rect x="560" y="547" width="150" height="24" class="pill" />
  <text x="635" y="564" text-anchor="middle" class="edge-Bold" fill="#FDE68A">QUICK STOP <tspan class="edge-Mono">0x05</tspan></text>

  <!-- ERR -> DISENGAGE (CLEAR ALARM 0x06, Wait for Fault Reg == 0x0000) -->
  <path d="M 190 642 L 130 642 L 130 136 L 376 136" class="line-std" marker-end="url(#arr-std)" />
  <rect x="18" y="365" width="224" height="46" class="pill" />
  <text x="130" y="384" text-anchor="middle" class="edge-Bold">CLEAR ALARM <tspan class="edge-Mono">0x06</tspan></text>
  <text x="130" y="403" text-anchor="middle" class="edge-Text">Wait for Fault Reg == 0x0000</text>

  <!-- JERK -> LOCK (RUN 0x08) -->
  <path d="M 870 642 L 920 642 L 920 302 L 684 302" class="line-std" marker-end="url(#arr-std)" />
  <rect x="866" y="458" width="108" height="26" class="pill" />
  <text x="920" y="476" text-anchor="middle" class="edge-Bold">RUN <tspan class="edge-Mono">0x08</tspan></text>
</svg>

