<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 140" width="1160" height="140" role="img" aria-label="Two-Tier Computing Split Architecture Diagram" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jetsonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="stm32Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="actuatorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Node 1: Computing Tier (NVIDIA Jetson) -->
  <rect x="24" y="25" width="260" height="90" rx="14" fill="url(#jetsonGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#boxShadow)" />
  <text x="154" y="58" fill="#38bdf8" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" text-anchor="middle" letter-spacing="0.06em">COMPUTING TIER</text>
  <text x="154" y="88" fill="#ffffff" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" text-anchor="middle">NVIDIA Jetson</text>

  <!-- Connector 1 (UART / USB) -->
  <path d="M 284 70 L 432 70" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="440,70 430,64 430,76" fill="#38bdf8" />
  <rect x="307" y="34" width="110" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="362" y="50" fill="#60a5fa" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" text-anchor="middle">UART / USB</text>

  <!-- Node 2: Dedicated Real-Time ECU (STM32 F446RE) -->
  <rect x="442" y="19" width="276" height="102" rx="14" fill="url(#stm32Grad)" stroke="#30d158" stroke-width="2.5" filter="url(#boxShadow)" />
  <text x="580" y="56" fill="#4ade80" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" text-anchor="middle" letter-spacing="0.06em">DEDICATED REAL-TIME ECU</text>
  <text x="580" y="88" fill="#ffffff" font-size="19" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" text-anchor="middle">STM32 F446RE</text>

  <!-- Connector 2 (CAN / GPIO / UART) -->
  <path d="M 718 70 L 866 70" fill="none" stroke="#30d158" stroke-width="2.5" />
  <polygon points="874,70 864,64 864,76" fill="#30d158" />
  <rect x="731" y="34" width="130" height="24" rx="6" fill="#064e3b" stroke="#30d158" stroke-width="1.5" />
  <text x="796" y="50" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" text-anchor="middle">CAN / GPIO / UART</text>

  <!-- Node 3: Physical Layer (Motors, Sensors, Actuators) -->
  <rect x="876" y="25" width="260" height="90" rx="14" fill="url(#actuatorGrad)" stroke="#a855f7" stroke-width="2.5" filter="url(#boxShadow)" />
  <text x="1006" y="58" fill="#c084fc" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" text-anchor="middle" letter-spacing="0.06em">PHYSICAL LAYER</text>
  <text x="1006" y="88" fill="#ffffff" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" text-anchor="middle">Motors, Sensors, Actuators</text>
</svg>
