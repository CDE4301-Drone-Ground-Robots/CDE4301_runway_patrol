<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1430 200" width="100%" height="auto" style="min-width: 920px; max-width: 1430px;" role="img" aria-label="Two-Tier Computing Split Architecture Diagram" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jetsonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"></stop>
      <stop offset="100%" stop-color="#0f172a"></stop>
    </linearGradient>
    <linearGradient id="stm32Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"></stop>
      <stop offset="100%" stop-color="#022c22"></stop>
    </linearGradient>
    <linearGradient id="actuatorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"></stop>
      <stop offset="100%" stop-color="#1e1b4b"></stop>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"></feDropShadow>
    </filter>
  </defs>

  <!-- Node 1: Autonomy Tier (NVIDIA Jetson) -->
  <a href="#why-separate-mcu" style="cursor: pointer;">
    <rect x="30" y="20" width="330" height="155" rx="14" fill="url(#jetsonGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#boxShadow)"></rect>
    <rect x="50" y="34" width="130" height="22" rx="11" fill="rgba(56, 189, 248, 0.18)"></rect>
    <text x="115" y="49" fill="#38bdf8" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.06em">COMPUTING TIER</text>
    <text x="50" y="88" fill="#ffffff" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700">NVIDIA Jetson</text>
    <text x="50" y="114" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">Perception, SLAM &amp; Global Nav</text>
    <text x="50" y="138" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">Non-real-time Linux OS (ROS 2)</text>
  </a>

  <!-- Connector 1 -->
  <path d="M 360 97.5 L 536 97.5" fill="none" stroke="#2997ff" stroke-width="2" stroke-dasharray="5,4"></path>
  <polygon points="538,97.5 528,92 528,103" fill="#2997ff"></polygon>
  <rect x="385" y="56" width="130" height="26" rx="7" fill="#0b1329" stroke="rgba(41, 151, 255, 0.45)" stroke-width="1"></rect>
  <text x="450" y="73" fill="#60a5fa" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">cmd_vel (500 ms WD)</text>

  <!-- Node 2: Dedicated Real-Time ECU (STM32 F446RE) -->
  <a href="#why-f446re" style="cursor: pointer;">
    <rect x="540" y="12" width="350" height="175" rx="16" fill="url(#stm32Grad)" stroke="#30d158" stroke-width="2" filter="url(#boxShadow)"></rect>
    <rect x="562" y="28" width="180" height="22" rx="11" fill="rgba(48, 209, 88, 0.22)"></rect>
    <text x="652" y="43" fill="#4ade80" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.06em">REAL-TIME ECU</text>
    <text x="562" y="82" fill="#ffffff" font-size="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700">STM32 NUCLEO-F446RE</text>
    <text x="562" y="110" fill="#86efac" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="500">Motor Control • Sensor I/O • Failsafe</text>
    <text x="562" y="134" fill="#a7f3d0" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">84 / 180 MHz Cortex-M4F • Bare-Metal 50 Hz</text>
    <text x="562" y="156" fill="#6ee7b7" font-size="10.5" font-family="'JetBrains Mono', monospace">250 ms Watchdog • DWT 11.9 ns Timing</text>
  </a>

  <!-- Connector 2 -->
  <path d="M 890 97.5 L 1066 97.5" fill="none" stroke="#30d158" stroke-width="2"></path>
  <polygon points="1068,97.5 1058,92 1058,103" fill="#30d158"></polygon>
  <rect x="910" y="56" width="140" height="26" rx="7" fill="#062e1e" stroke="rgba(48, 209, 88, 0.45)" stroke-width="1"></rect>
  <text x="980" y="73" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">CAN 500k / 5V Sink</text>

  <!-- Node 3: Physical Layer (Drivers, Sensors & Actuators) -->
  <a href="#interface-wiring" style="cursor: pointer;">
    <rect x="1070" y="20" width="330" height="155" rx="14" fill="url(#actuatorGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#boxShadow)"></rect>
    <rect x="1092" y="34" width="130" height="22" rx="11" fill="rgba(168, 85, 247, 0.2)"></rect>
    <text x="1157" y="49" fill="#c084fc" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.06em">PHYSICAL LAYER</text>
    <text x="1092" y="86" fill="#ffffff" font-size="19" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700">Motors, Sensors, Actuators</text>
    <text x="1092" y="114" fill="#d8b4fe" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">2× ZLAC8015D, TB6600, Gamepad</text>
    <text x="1092" y="138" fill="#a855f7" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">11 Pre-Allocated Hardware Interfaces</text>
  </a>
</svg>
