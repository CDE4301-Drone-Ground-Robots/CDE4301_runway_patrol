<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1320 290" width="100%" height="auto" style="min-width: 860px; max-width: 1320px;" role="img" aria-label="6-State Firmware Safety State Machine Diagram" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="smInitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"></stop>
      <stop offset="100%" stop-color="#0f172a"></stop>
    </linearGradient>
    <linearGradient id="smReadyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"></stop>
      <stop offset="100%" stop-color="#022c22"></stop>
    </linearGradient>
    <linearGradient id="smWarnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451a03"></stop>
      <stop offset="100%" stop-color="#270e02"></stop>
    </linearGradient>
    <linearGradient id="smFaultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"></stop>
      <stop offset="100%" stop-color="#280505"></stop>
    </linearGradient>
    <filter id="smShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"></feDropShadow>
    </filter>
  </defs>

  <!-- State 1: INIT -->
  <a href="#phase-5" style="cursor: pointer;">
    <rect x="25" y="95" width="175" height="90" rx="10" fill="url(#smInitGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#smShadow)"></rect>
    <text x="112.5" y="120" fill="#38bdf8" font-size="9.5" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">BOOT PROBE</text>
    <text x="112.5" y="142" fill="#ffffff" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">ROBOT_STATE_INIT</text>
    <text x="112.5" y="160" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" text-anchor="middle">SDO Read 0x6041 (Node 1 &amp; 2)</text>
    <text x="112.5" y="175" fill="#67e8f9" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">CiA 402: 0x06 → 0x07 → 0x0F</text>
  </a>

  <!-- Arrow INIT -> DISCONNECTED -->
  <path d="M 200 140 L 258 140" fill="none" stroke="#38bdf8" stroke-width="2"></path>
  <polygon points="260,140 252,136 252,144" fill="#38bdf8"></polygon>
  <text x="230" y="130" fill="#94a3b8" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Nodes OK</text>

  <!-- State 2: DISCONNECTED -->
  <a href="#section-8-safety" style="cursor: pointer;">
    <rect x="260" y="95" width="195" height="90" rx="10" fill="url(#smWarnGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#smShadow)"></rect>
    <text x="357.5" y="120" fill="#fbbf24" font-size="9.5" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">WAIT FOR LINK</text>
    <text x="357.5" y="142" fill="#ffffff" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">DISCONNECTED</text>
    <text x="357.5" y="160" fill="#fde68a" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" text-anchor="middle">USB Unplugged / No Host</text>
    <text x="357.5" y="175" fill="#fbbf24" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">Target Velocity = 0 RPM</text>
  </a>

  <!-- Arrow DISCONNECTED -> READY -->
  <path d="M 455 140 L 543 140" fill="none" stroke="#30d158" stroke-width="2"></path>
  <polygon points="545,140 537,136 537,144" fill="#30d158"></polygon>
  <text x="500" y="130" fill="#4ade80" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">HID Enum</text>

  <!-- State 3: READY (Active Motion Enabled) -->
  <a href="#phase-5" style="cursor: pointer;">
    <rect x="545" y="85" width="230" height="110" rx="12" fill="url(#smReadyGrad)" stroke="#30d158" stroke-width="2" filter="url(#smShadow)"></rect>
    <text x="660" y="112" fill="#4ade80" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">ONLY MOTION-ENABLED STATE</text>
    <text x="660" y="136" fill="#ffffff" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">ROBOT_STATE_READY</text>
    <text x="660" y="156" fill="#86efac" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" text-anchor="middle">50 Hz Kinematics &amp; Velocity Ramp</text>
    <text x="660" y="174" fill="#6ee7b7" font-size="9.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">150 ms Statusword 0x6041 Poll</text>
  </a>

  <!-- Arrow READY -> WATCHDOG_STOP (Top Right) -->
  <path d="M 775 110 L 898 55" fill="none" stroke="#fbbf24" stroke-width="2"></path>
  <polygon points="900,54 891,54 894,61" fill="#fbbf24"></polygon>
  <text x="830" y="68" fill="#fbbf24" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">≥ 250 ms Timeout</text>

  <!-- State 4: WATCHDOG_STOP -->
  <a href="#section-8-safety" style="cursor: pointer;">
    <rect x="900" y="15" width="205" height="80" rx="10" fill="url(#smWarnGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#smShadow)"></rect>
    <text x="1002.5" y="38" fill="#fbbf24" font-size="9.5" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">PACKET TIMEOUT</text>
    <text x="1002.5" y="58" fill="#ffffff" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">WATCHDOG_STOP</text>
    <text x="1002.5" y="76" fill="#fde68a" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" text-anchor="middle">250 ms Gamepad / 500 ms ROS</text>
  </a>

  <!-- Arrow READY -> ESTOP_LATCHED (Middle Right) -->
  <path d="M 775 140 L 898 140" fill="none" stroke="#f87171" stroke-width="2"></path>
  <polygon points="900,140 892,136 892,144" fill="#f87171"></polygon>
  <text x="837" y="131" fill="#f87171" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">B / BACK E-Stop</text>

  <!-- State 5: ESTOP_LATCHED -->
  <a href="#section-8-safety" style="cursor: pointer;">
    <rect x="900" y="100" width="205" height="80" rx="10" fill="url(#smFaultGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#smShadow)"></rect>
    <text x="1002.5" y="123" fill="#f87171" font-size="9.5" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">HARD LATCHED BRAKE</text>
    <text x="1002.5" y="143" fill="#ffffff" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">ESTOP_LATCHED</text>
    <text x="1002.5" y="161" fill="#fca5a5" font-size="9.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">CiA 402 Quick-Stop (0x0002)</text>
  </a>

  <!-- Arrow READY -> CAN_FAULT (Bottom Right) -->
  <path d="M 775 170 L 898 225" fill="none" stroke="#f87171" stroke-width="2"></path>
  <polygon points="900,226 894,219 891,226" fill="#f87171"></polygon>
  <text x="830" y="216" fill="#f87171" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">BOFF / Bit 3 Fault</text>

  <!-- State 6: CAN_FAULT -->
  <a href="#section-8-safety" style="cursor: pointer;">
    <rect x="900" y="185" width="205" height="80" rx="10" fill="url(#smFaultGrad)" stroke="#ef4444" stroke-width="1.5" filter="url(#smShadow)"></rect>
    <text x="1002.5" y="208" fill="#f87171" font-size="9.5" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">BUS OR DRIVER ALARM</text>
    <text x="1002.5" y="228" fill="#ffffff" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">CAN_FAULT</text>
    <text x="1002.5" y="246" fill="#fca5a5" font-size="9.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">0x6041 Bit 3 (0x0008) / ESR BOFF</text>
  </a>

  <!-- Re-arm Gate Return Loop -->
  <path d="M 1105 140 L 1285 140 L 1285 275 L 660 275 L 660 197" fill="none" stroke="#30d158" stroke-width="2" stroke-dasharray="6,4"></path>
  <path d="M 1105 55 L 1285 55 L 1285 140" fill="none" stroke="#30d158" stroke-width="1.5" stroke-dasharray="6,4"></path>
  <path d="M 1105 225 L 1285 225 L 1285 140" fill="none" stroke="#30d158" stroke-width="1.5" stroke-dasharray="6,4"></path>
  <polygon points="660,195 656,203 664,203" fill="#30d158"></polygon>

  <rect x="815" y="258" width="380" height="24" rx="6" fill="#062e1e" stroke="rgba(48, 209, 88, 0.55)" stroke-width="1"></rect>
  <text x="1005" y="274" fill="#4ade80" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">
    Re-Arm Gate: A / START + controls_neutral (Bit 7 0x0080 Reset)
  </text>
</svg>

