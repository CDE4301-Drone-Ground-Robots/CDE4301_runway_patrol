[platformio]
; Tell PlatformIO to look in Core/Src and Core/Inc instead of src/ and include/
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube

; Include paths for HAL drivers, USB Host middleware, and headers
build_flags =
    -I Core/Inc
    -I Drivers/STM32F4xx_HAL_Driver/Inc
    -I Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
    -I Drivers/CMSIS/Device/ST/STM32F4xx/Include
    -I Drivers/CMSIS/Include
    -I Middlewares/ST/STM32_USB_Host_Library/Core/Inc
    -I Middlewares/ST/STM32_USB_Host_Library/Class/HID/Inc
    -I USB_HOST/App
    -I USB_HOST/Target

; Tell PlatformIO to compile USB Host & HAL source files
build_src_filter =
    +<*.c>
    +<../../USB_HOST/App/*.c>
    +<../../USB_HOST/Target/*.c>
    +<../../Middlewares/ST/STM32_USB_Host_Library/Core/Src/*.c>
    +<../../Middlewares/ST/STM32_USB_Host_Library/Class/HID/Src/*.c>

; ST-Link upload and debug settings
upload_protocol = mbed
debug_tool = stlink

; Serial Monitor configuration
monitor_port = COM3
monitor_speed = 115200
